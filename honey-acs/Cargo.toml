[package]
name = "honey-acs"
version = "0.1.0"
edition = "2024"

[features]
python-backend = ["dep:pyo3"]

[dependencies]
bincode = "1.3"
crossbeam-channel = "0.5"
honey-crypto = { path = "../honey-crypto" }
honey-wire = { path = "../honey-wire" }
k256 = "0.13.4"
rand = "0.10.0"
rkyv = "0.8.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
pyo3 = { version = "0.28.2", features = ["auto-initialize"], optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"], optional = true }
