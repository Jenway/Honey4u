[package]
name = "honey-bench"
version = "0.1.0"
edition = "2024"
default-run = "honey-bench"

[dependencies]
clap = { version = "=4.6.0", features = ["derive"] }
honey-acs = { path = "../honey-acs" }
honey-node = { path = "../honey-node", default-features = false }
honey-wire = { path = "../honey-wire" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
