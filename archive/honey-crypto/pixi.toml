[workspace]
authors = ["刘振伟 <JenwayHere@Gmail.com>"]
channels = ["conda-forge"]
name = "honey-crypto"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
configure = "cmake -B build -G Ninja"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
install = { cmd = "cmake --install build --prefix dist", depends-on = ["build"] }

[dependencies]
libblst = ">=0.3.16,<0.4"
isa-l = ">=2.31.1,<3"
openssl = ">=3.6.1,<4"
libsecp256k1 = ">=0.7.1,<0.8"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
doctest = ">=2.4.12,<3"
spdlog = ">=1.17.0,<2"
fmt = ">=12.1.0,<13"
pre-commit = ">=4.5.1,<5"
