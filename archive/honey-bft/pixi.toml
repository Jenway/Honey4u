[workspace]
channels = ["conda-forge"]
name = "honeyBFT"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
configure = "cmake --preset debug"
build = "cmake --build --preset debug"

[dependencies]
openssl = ">=3.6.1,<4"
libsecp256k1 = ">=0.7.1,<0.8"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
spdlog = ">=1.17.0,<2"
python = ">=3.14.3,<3.15"
asio = ">=1.29.0,<2"
isa-l = ">=2.31.1,<3"
libblst = ">=0.3.16,<0.4"
pre-commit = ">=4.5.1,<5"
