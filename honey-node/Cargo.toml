[package]
name = "honey-node"
version = "0.1.0"
edition = "2024"

[features]
default = ["python-backend"]
python-backend = ["honey-acs/python-backend", "dep:pyo3", "dep:pyo3-build-config"]

[dependencies]
clap = { version = "=4.6.0", features = ["derive"] }
crossbeam-channel = "0.5"
hex = "0.4"
honey-acs = { path = "../honey-acs" }
honey-crypto = { path = "../honey-crypto" }
honey-wire = { path = "../honey-wire" }
k256 = "0.13.4"
metrics = "0.24"
pyo3 = { version = "0.28.2", features = ["auto-initialize"], optional = true }
rand = "0.10.0"
rkyv = "0.8.15"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
toml = "0.8"

[build-dependencies]
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"], optional = true }
