[package]
name = "honey-node"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
crossbeam-channel = "0.5"
hex = "0.4"
honey-acs = { path = "../honey-acs", features = ["python-backend"] }
honey-crypto = { path = "../honey-crypto" }
honey-wire = { path = "../honey-wire" }
k256 = "0.13.4"
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
rand = "0.10.0"
rkyv = "0.8.15"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
toml = "0.8"

[build-dependencies]
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"] }
