[suite]
name = "dumbo_grace_python_micro"

[defaults]
rounds = 4
repeats = 2
global_timeout = 150.0
transport = "quic"
pool_reuse_limit_per_round = 4
pool_expire_rounds = 10
pool_mempool_max = 1024
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "grace_python_n12_micro"
description = "Compact grace-window sensitivity run for thesis figures."
backend = ["python_dumbo"]
reuse_enabled = [true]
nodes = [12]
batch_size = [32]
pool_grace_ms = [50, 100, 200, 400]
