[suite]
name = "paper_slow_reuse_on_fill"

[defaults]
rounds = 6
repeats = 3
global_timeout = 600.0
transport = "quic"
pool_grace_ms = 100
pool_reuse_limit_per_round = 4
pool_expire_rounds = 10
pool_mempool_max = 4096
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "slow_reuse_on_fill"
description = "Fill missing reuse_on data: slow0-slow3."
backend = ["rust_fin"]
reuse_enabled = [true]
nodes = [12]
batch_size = [1024]
network_faults = [
  { label = "slow0", enabled = false },
  { label = "slow1", enabled = true, seed = 20260508, slow_honest = { pids = [11], extra_delay_ms = 150 } },
  { label = "slow2", enabled = true, seed = 20260508, slow_honest = { pids = [10, 11], extra_delay_ms = 150 } },
  { label = "slow3", enabled = true, seed = 20260508, slow_honest = { pids = [9, 10, 11], extra_delay_ms = 150 } },
]
