[suite]
name = "reuse_postfix_probe_n16"

[defaults]
rounds = 4
repeats = 1
global_timeout = 120.0
transport = "quic"
pool_grace_ms = 35
pool_reuse_limit_per_round = 5
pool_expire_rounds = 3
pool_mempool_max = 4096
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "reuse_postfix_window_n16"
description = "Small post-fix sweep to locate where extra proposals start reappearing."
backend = ["rust_fin"]
reuse_enabled = [false, true]
nodes = [16]
batch_size = [2048]
network_faults = [
  { label = "slow25p11_15", enabled = true, seed = 20260429, slow_honest = { pids = [11, 12, 13, 14, 15], extra_delay_ms = 25 } },
  { label = "slow40p11_15", enabled = true, seed = 20260429, slow_honest = { pids = [11, 12, 13, 14, 15], extra_delay_ms = 40 } },
  { label = "slow60p11_15", enabled = true, seed = 20260429, slow_honest = { pids = [11, 12, 13, 14, 15], extra_delay_ms = 60 } },
]
