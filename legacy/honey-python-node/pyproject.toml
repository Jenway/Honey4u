[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honey-legacy-node"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "honey-shared",
    "honey-acs",
    "honey-runtime",
    "honey-native",
]

[tool.hatch.build.targets.wheel]
packages = ["src/honey_legacy_node"]
