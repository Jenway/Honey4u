# Local HoneyBadger benchmark with Dumbo ACS as the provider.
mode = "benchmark"
sid = "bench:local:hb:dumbo-acs"
acs_backend = "python_dumbo"
nodes = 4
faulty = 1
rounds = 5
batch_size = 256
global_timeout = 120.0

[config]
enable_broadcast_pool_reuse = true
pool_grace_ms = 200
broadcast_mempool_backend = "rust"
pool_mempool_max = 1000
