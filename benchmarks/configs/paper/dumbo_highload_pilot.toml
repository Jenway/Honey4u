[suite]
name = "dumbo_highload_pilot"

[defaults]
rounds = 8
repeats = 2
global_timeout = 180.0
transport = "quic"
pool_grace_ms = 100
pool_reuse_limit_per_round = 4
pool_expire_rounds = 10
pool_mempool_max = 1024
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "highload_n12_pilot"
description = "Pilot high-load slice for N=12 before launching the full thesis run."
backend = ["python_dumbo", "rust_fin"]
reuse_enabled = [false, true]
nodes = [12]
batch_size = [16, 32, 48]
