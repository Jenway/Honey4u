[suite]
name = "reuse_focus_n16"

[defaults]
rounds = 10
repeats = 2
global_timeout = 300.0
transport = "quic"
pool_grace_ms = 35
pool_reuse_limit_per_round = 5
pool_expire_rounds = 3
pool_mempool_max = 4096
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "reuse_activation_n16"
description = "Focused reuse-on activation scan across smaller slow tails and moderate delay."
backend = ["rust_fin"]
reuse_enabled = [true]
nodes = [16]
batch_size = [1024, 2048]
network_faults = [
  { label = "slow15p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 15 } },
  { label = "slow20p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 20 } },
  { label = "slow25p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 25 } },
  { label = "slow20p12_15", enabled = true, seed = 20260429, slow_honest = { pids = [12, 13, 14, 15], extra_delay_ms = 20 } },
]

[[experiments]]
name = "reuse_grace_focus_n16"
description = "Check whether a longer grace window unlocks reuse at b=2048 with a 3-node slow tail."
backend = ["rust_fin"]
reuse_enabled = [true]
nodes = [16]
batch_size = [2048]
pool_grace_ms = [35, 100, 200]
network_faults = [
  { label = "slow25p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 25 } },
]

[[experiments]]
name = "reuse_confirm_n16"
description = "Small off/on confirmation for the best-looking 3-node slow-tail settings."
backend = ["rust_fin"]
reuse_enabled = [false, true]
nodes = [16]
batch_size = [1024, 2048]
network_faults = [
  { label = "slow15p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 15 } },
  { label = "slow25p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 25 } },
]

[[experiments]]
name = "reuse_zero_grace_candidates_n16"
description = "Search for a better wall-throughput tradeoff with zero grace and tighter reuse limits."
backend = ["rust_fin"]
reuse_enabled = [true]
nodes = [16]
batch_size = [1024, 2048]
pool_grace_ms = 0
pool_reuse_limit_per_round = [1, 2]
network_faults = [
  { label = "slow20p12_15", enabled = true, seed = 20260429, slow_honest = { pids = [12, 13, 14, 15], extra_delay_ms = 20 } },
  { label = "slow25p13_15", enabled = true, seed = 20260429, slow_honest = { pids = [13, 14, 15], extra_delay_ms = 25 } },
]

[[experiments]]
name = "reuse_zero_grace_off_baseline_n16"
description = "Off baselines for zero-grace candidate comparison where no prior off run exists."
backend = ["rust_fin"]
reuse_enabled = [false]
nodes = [16]
batch_size = [1024, 2048]
pool_grace_ms = 0
network_faults = [
  { label = "slow20p12_15", enabled = true, seed = 20260429, slow_honest = { pids = [12, 13, 14, 15], extra_delay_ms = 20 } },
]

[[experiments]]
name = "reuse_best_candidate_n16"
description = "Confirm the strongest zero-grace candidate with more repeats."
backend = ["rust_fin"]
reuse_enabled = [false, true]
nodes = [16]
batch_size = [1024]
rounds = 16
repeats = 4
global_timeout = 300.0
pool_grace_ms = 0
pool_reuse_limit_per_round = 1
pool_expire_rounds = 3
pool_mempool_max = 4096
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true
network_faults = [
  { label = "slow20p12_15", enabled = true, seed = 20260429, slow_honest = { pids = [12, 13, 14, 15], extra_delay_ms = 20 } },
]
