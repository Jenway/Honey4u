[suite]
name = "paper_grace_sensitivity"

[defaults]
rounds = 6
repeats = 3
global_timeout = 300.0
transport = "quic"
pool_reuse_limit_per_round = 4
pool_expire_rounds = 10
pool_mempool_max = 8192
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "grace_sensitivity"
description = "Grace window sweep: python_dumbo + rust_fin, N=12, b=4096."
backend = ["python_dumbo", "rust_fin"]
reuse_enabled = [true]
nodes = [12]
batch_size = [4096]
pool_grace_ms = [0, 50, 100, 200, 400, 800]
