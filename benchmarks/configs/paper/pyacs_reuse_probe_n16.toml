[suite]
name = "pyacs_reuse_probe_n16"

[defaults]
rounds = 2
repeats = 2
global_timeout = 120.0
transport = "quic"
pool_grace_ms = 35
pool_reuse_limit_per_round = 8
pool_expire_rounds = 3
pool_mempool_max = 4096
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "python_dumbo_reuse_probe_n16"
description = "Small post-fix probe for python_dumbo reuse under slow_honest."
backend = ["python_dumbo"]
reuse_enabled = [false, true]
nodes = [16]
batch_size = [2048]
network_faults = [
  { label = "slow25p11_15", enabled = true, seed = 20260429, slow_honest = { pids = [11, 12, 13, 14, 15], extra_delay_ms = 25 } },
]
