[suite]
name = "dumbo_paper_smoke"

[defaults]
rounds = 3
repeats = 1
global_timeout = 90.0
pool_grace_ms = 100
pool_reuse_limit_per_round = 4
pool_expire_rounds = 5
pool_mempool_max = 512
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "smoke_reuse_scale"
description = "Small reproducibility check before launching the full paper suite."
backend = ["python_dumbo", "rust_fin"]
reuse_enabled = [false, true]
nodes = [4, 8]
batch_size = [8, 16]

[[experiments]]
name = "smoke_network_faults"
description = "Quick delay-injection smoke test for the rust-driver transport path."
backend = ["rust_fin"]
reuse_enabled = [false, true]
nodes = [4]
batch_size = [8]
network_faults = [
  { label = "none", enabled = false },
  { label = "fixed5", enabled = true, seed = 20260416, fixed_delay_ms = 5 },
  { label = "slow20p3", enabled = true, seed = 20260416, slow_honest = { pids = [3], extra_delay_ms = 20 } },
]

[[experiments]]
name = "smoke_byzantine_silent"
description = "Quick smoke test for the initial silent byzantine-node behavior."
backend = ["rust_fin"]
reuse_enabled = [false, true]
nodes = [4]
batch_size = [8]
byzantine_nodes = [{ pid = 3, behavior = "silent" }]
