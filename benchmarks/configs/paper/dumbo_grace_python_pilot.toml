[suite]
name = "dumbo_grace_python_pilot"

[defaults]
rounds = 6
repeats = 3
global_timeout = 180.0
pool_reuse_limit_per_round = 4
pool_expire_rounds = 10
pool_mempool_max = 1024
enable_pool_reference_proposals = true
enable_pool_fetch_fallback = true

[[experiments]]
name = "grace_python_n12"
description = "Grace-window sensitivity on the Python Dumbo path for thesis-ready analysis."
backend = ["python"]
reuse_enabled = [true]
nodes = [12]
batch_size = [32]
pool_grace_ms = [50, 100, 200, 400]
