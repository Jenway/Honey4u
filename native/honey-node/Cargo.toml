[package]
name = "honey-node"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
honey-native = { path = "../honey-native" }
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
runtime-core = { path = "../runtime-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"

[build-dependencies]
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"] }
