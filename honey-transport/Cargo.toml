[package]
name = "honey-transport"
version = "0.1.0"
edition = "2024"

[features]
default = ["tcp"]
tcp = []
quic = ["dep:quinn", "dep:tokio", "dep:rustls", "dep:rcgen"]
nng = ["dep:nng"]

[dependencies]
crossbeam-channel = "0.5"
nng = { version = "2", optional = true }
quinn = { version = "0.11", optional = true }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "sync", "macros"] }
