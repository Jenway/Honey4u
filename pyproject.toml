[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honey-cr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "honey-acs",
    "honey-native",
]

[tool.uv.workspace]
members = [
    "honey-acs/packages/honey-acs",
    "honey-acs/honey-native",
]

[tool.uv.sources]
honey-acs = { workspace = true }
honey-native = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/honey_cr"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "honey-acs/packages/honey-acs/src",
    ".",
]
testpaths = [
    "honey-acs/packages/honey-acs/tests",
    "honey-acs/honey-native/tests",
]

[tool.ty.environment]
root = [
    "honey-acs/packages/honey-acs/src",
    "honey-acs/honey-native",
]

[tool.ty.src]
include = [
    "honey-acs/packages/honey-acs/src/honey_acs",
    "honey-acs/honey-native/tests/native/test_ecdsa_and_crypto_params.py",
]
exclude = [
    ".tmp*",
]

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.4",
    "ty>=0.0.1a16",
]
