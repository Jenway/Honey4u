[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honey-cr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "honey-shared",
    "honey-acs",
    "honey-runtime",
    "honey-legacy-node",
    "honey-native",
]

[tool.uv.workspace]
members = [
    "packages/honey-shared",
    "packages/honey-acs",
    "packages/honey-runtime",
    "legacy/honey-python-node",
    "native/honey-native",
]

[tool.uv.sources]
honey-shared = { workspace = true }
honey-acs = { workspace = true }
honey-runtime = { workspace = true }
honey-legacy-node = { workspace = true }
honey-native = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/honey_cr"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "packages/honey-shared/src",
    "packages/honey-acs/src",
    "packages/honey-runtime/src",
    "legacy/honey-python-node/src",
    ".",
]

[tool.ty.environment]
root = [
    "src",
    "packages/honey-shared/src",
    "packages/honey-acs/src",
    "packages/honey-runtime/src",
    "legacy/honey-python-node/src",
]

[tool.ty.src]
include = [
    "packages/honey-shared/src/honey_shared",
    "packages/honey-acs/src/honey_acs",
    "packages/honey-runtime/src/honey_runtime/transport",
    "packages/honey-runtime/src/honey_runtime/routing",
    "packages/honey-runtime/src/honey_runtime/drivers/crypto_material.py",
    "legacy/honey-python-node/src/honey_legacy_node/bootstrap.py",
    "tests/native/test_ecdsa_and_crypto_params.py",
    "tests/runtime/test_runtime_boundaries.py",
]
exclude = [
    "benchmarks",
    "refer",
    "refer_dag",
    ".tmp*",
]

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.4",
    "ty>=0.0.1a16",
]
